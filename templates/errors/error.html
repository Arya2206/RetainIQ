{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-primary">{{ code }}</div>
  <h3 class="mt-2">{{ title }}</h3>
  <p class="text-muted mx-auto" style="max-width:520px">{{ msg }}</p>
  <a href="{{ url_for('auth.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}

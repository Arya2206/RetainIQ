{% extends "base.html" %}
{% block title %}Post opportunity{% endblock %}
{% block content %}
<div class="col-lg-6 mx-auto"><div class="card-soft p-4"><h5 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> Post a new opportunity</h5>
<form method="POST">{{ csrf_input() }}
  <div class="mb-3"><label class="form-label small text-muted">Title</label><input class="form-control" name="title" required maxlength="150"></div>
  <div class="mb-3"><label class="form-label small text-muted">Description</label><textarea class="form-control" name="description" rows="4"></textarea></div>
  <div class="mb-3"><label class="form-label small text-muted">Department</label><select class="form-select" name="department_id">{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div>
  <div class="mb-3"><label class="form-label small text-muted">Required skills (comma separated)</label><input class="form-control" name="skills" placeholder="Python, SQL, Cloud"></div>
  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="is_internal" id="int" checked><label class="form-check-label small" for="int">Internal opportunity (employees are notified)</label></div>
  <button class="btn btn-primary w-100">Post opportunity</button></form></div></div>
{% endblock %}
